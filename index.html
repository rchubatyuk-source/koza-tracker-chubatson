<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOZA Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            overflow: hidden;
        }
        
        #map {
            width: 100vw;
            height: 55vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .info-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 45vh;
            background: rgba(0, 0, 0, 0.95);
            padding: 10px;
            overflow-y: auto;
        }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 13px;
            padding: 6px;
            background: #2a2a2a;
            border-radius: 5px;
        }
        
        .battery {
            font-weight: bold;
        }
        
        .battery.high { color: #4CAF50; }
        .battery.medium { color: #FF9800; }
        .battery.low { color: #F44336; }
        
        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin: 3px 0;
        }
        
        .btn-connect {
            background: #4CAF50;
            color: white;
        }
        
        .btn-disconnect {
            background: #F44336;
            color: white;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .status {
            text-align: center;
            padding: 8px;
            background: #2a2a2a;
            border-radius: 8px;
            margin: 5px 0;
            font-size: 12px;
        }
        
        .status.connected { background: #1b5e20; }
        .status.disconnected { background: #b71c1c; }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-top: 5px;
        }
        
        h2 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 18px;
        }
        
        .distance-info {
            background: #1565C0;
            padding: 8px;
            border-radius: 5px;
            text-align: center;
            margin: 5px 0;
            font-size: 14px;
            font-weight: bold;
        }
        
        .map-selector {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px;
            border-radius: 8px;
        }
        
        .map-selector button {
            background: #2a2a2a;
            color: white;
            border: none;
            padding: 8px 12px;
            margin: 2px;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .map-selector button.active {
            background: #4CAF50;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="map-selector">
        <button id="mapStandard" class="active" onclick="changeMap('standard')">🗺️ Карта</button>
        <button id="mapSatellite" onclick="changeMap('satellite')">🛰️ Спутник</button>
        <button id="mapHybrid" onclick="changeMap('hybrid')">🌍 Гибрид</button>
    </div>
    
    <div class="info-panel">
        <h2>🐐 KOZA Tracker</h2>
        
        <div id="status" class="status disconnected">
            Не подключено
        </div>
        
        <button id="connectBtn" class="btn btn-connect" onclick="connectBLE()">
            🔗 Подключиться
        </button>
        
        <button id="disconnectBtn" class="btn btn-disconnect" onclick="disconnectBLE()" style="display:none;">
            ✂️ Отключиться
        </button>
        
        <div class="distance-info" id="distance">
            📏 Расстояние до козы: --
        </div>
        
        <div class="status-row">
            <span>🐐 ID:</span>
            <span id="koza-id">--</span>
        </div>
        
        <div class="status-row">
            <span>📍 Координаты:</span>
            <span id="coords" style="font-size: 11px;">--</span>
        </div>
        
        <div class="status-row">
            <span>🔋 Коза:</span>
            <span class="battery" id="koza-battery">--</span>
        </div>
        
        <div class="status-row">
            <span>📱 База:</span>
            <span class="battery" id="base-battery">--</span>
        </div>
        
        <div class="status-row">
            <span>🛰️ Спутники:</span>
            <span id="satellites">--</span>
        </div>
        
        <div class="controls">
            <button class="btn btn-connect" onclick="centerOnKoza()">🎯 К козе</button>
            <button class="btn btn-connect" onclick="centerOnMe()">📍 Ко мне</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, kozaMarker, myMarker, accuracyCircle;
        let bleDevice = null;
        let bleCharacteristic = null;
        let kozaData = { lat: 0, lng: 0, id: 0, battery: 0, satellites: 0, baseBattery: 0, rssi: 0 };
        let myPosition = { lat: 0, lng: 0 };
        
        let currentLayer = null;
        let mapLayers = {};
        
        // Инициализация карты
        map = L.map('map').setView([49.097202, 132.479824], 15);
        
        // Создаём разные слои карт
        mapLayers.standard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });
        
        mapLayers.satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: '© Esri'
        });
        
        mapLayers.hybrid = L.layerGroup([
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19
            }),
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}.png', {
                maxZoom: 19
            })
        ]);
        
        // Добавляем стандартную карту по умолчанию
        currentLayer = mapLayers.standard;
        currentLayer.addTo(map);
        
        // Маркер козы
        const kozaIcon = L.divIcon({
            html: '<div style="background: #4CAF50; width: 50px; height: 50px; border-radius: 50%; border: 5px solid white; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 20px rgba(76,175,80,0.7);">🐐</div>',
            iconSize: [50, 50],
            iconAnchor: [25, 25]
        });
        
        kozaMarker = L.marker([49.097202, 132.479824], { icon: kozaIcon }).addTo(map)
            .bindPopup('<b>КОЗА #77</b><br>Ожидание данных...');
        
        // Маркер моей позиции
        const myIcon = L.divIcon({
            html: '<div style="background: #2196F3; width: 30px; height: 30px; border-radius: 50%; border: 4px solid white; box-shadow: 0 2px 15px rgba(33,150,243,0.7);"></div>',
            iconSize: [30, 30],
            iconAnchor: [15, 15]
        });
        
        myMarker = L.marker([49.097202, 132.479824], { icon: myIcon }).addTo(map)
            .bindPopup('<b>Я</b>');
        
        accuracyCircle = L.circle([49.097202, 132.479824], {
            radius: 50,
            color: '#2196F3',
            fillColor: '#2196F3',
            fillOpacity: 0.1,
            weight: 1
        }).addTo(map);
        
        // Получение моей позиции
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((position) => {
                myPosition.lat = position.coords.latitude;
                myPosition.lng = position.coords.longitude;
                myMarker.setLatLng([myPosition.lat, myPosition.lng]);
                accuracyCircle.setLatLng([myPosition.lat, myPosition.lng]);
                accuracyCircle.setRadius(position.coords.accuracy);
                updateDistance();
            }, null, {
                enableHighAccuracy: true,
                maximumAge: 0
            });
        }
        
        async function connectBLE() {
            try {
                document.getElementById('status').textContent = 'Поиск устройства...';
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'KOZA_BASE' }],
                    optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
                });
                
                document.getElementById('status').textContent = 'Подключение...';
                
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
                bleCharacteristic = await service.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dcca9e');
                
                await bleCharacteristic.startNotifications();
                bleCharacteristic.addEventListener('characteristicvaluechanged', handleData);
                
                document.getElementById('status').textContent = 'Подключено! ✓';
                document.getElementById('status').className = 'status connected';
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('disconnectBtn').style.display = 'block';
                
            } catch (error) {
                console.error('Ошибка BLE:', error);
                document.getElementById('status').textContent = 'Ошибка: ' + error.message;
                document.getElementById('status').className = 'status disconnected';
            }
        }
        
        function disconnectBLE() {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
            }
            document.getElementById('status').textContent = 'Отключено';
            document.getElementById('status').className = 'status disconnected';
            document.getElementById('connectBtn').style.display = 'block';
            document.getElementById('disconnectBtn').style.display = 'none';
        }
        
        function handleData(event) {
            const value = new TextDecoder().decode(event.target.value);
            console.log('Получены данные:', value);
            
            try {
                const json = JSON.parse(value);
                kozaData = json;
                
                if (json.lat !== 0 && json.lng !== 0) {
                    kozaMarker.setLatLng([json.lat, json.lng]);
                    kozaMarker.setPopupContent(`<b>КОЗА #${json.id}</b><br>Заряд: ${json.battery}%<br>Спутники: ${json.satellites}`);
                }
                
                document.getElementById('koza-id').textContent = json.id;
                document.getElementById('coords').textContent = json.lat.toFixed(6) + ', ' + json.lng.toFixed(6);
                updateBattery('koza-battery', json.battery);
                updateBattery('base-battery', json.base_battery);
                document.getElementById('satellites').textContent = json.satellites + ' (RSSI: ' + json.rssi + ')';
                
                document.getElementById('status').textContent = 'Обновлено: ' + new Date().toLocaleTimeString('ru');
                
                updateDistance();
                
            } catch (e) {
                console.error('Ошибка парсинга:', e);
            }
        }
        
        function updateBattery(id, percent) {
            const el = document.getElementById(id);
            el.textContent = percent + '%';
            el.className = 'battery ' + (percent > 50 ? 'high' : percent > 20 ? 'medium' : 'low');
        }
        
        function updateDistance() {
            if (kozaData.lat !== 0 && kozaData.lng !== 0 && myPosition.lat !== 0) {
                const distance = map.distance([myPosition.lat, myPosition.lng], [kozaData.lat, kozaData.lng]);
                const distText = distance < 1000 ? 
                    Math.round(distance) + ' м' : 
                    (distance / 1000).toFixed(2) + ' км';
                document.getElementById('distance').textContent = '📏 Расстояние до козы: ' + distText;
            }
        }
        
        function centerOnKoza() {
            if (kozaData.lat !== 0 && kozaData.lng !== 0) {
                map.setView([kozaData.lat, kozaData.lng], 16);
            } else {
                alert('❌ Нет координат козы!');
            }
        }
        
        function centerOnMe() {
            if (myPosition.lat !== 0 && myPosition.lng !== 0) {
                map.setView([myPosition.lat, myPosition.lng], 16);
            } else {
                alert('❌ Нет вашей позиции!');
            }
        }
        
        function changeMap(type) {
            map.removeLayer(currentLayer);
            currentLayer = mapLayers[type];
            currentLayer.addTo(map);
            
            document.getElementById('mapStandard').classList.remove('active');
            document.getElementById('mapSatellite').classList.remove('active');
            document.getElementById('mapHybrid').classList.remove('active');
            
            if (type === 'standard') {
                document.getElementById('mapStandard').classList.add('active');
            } else if (type === 'satellite') {
                document.getElementById('mapSatellite').classList.add('active');
            } else if (type === 'hybrid') {
                document.getElementById('mapHybrid').classList.add('active');
            }
        }
    </script>
</body>
</html>
