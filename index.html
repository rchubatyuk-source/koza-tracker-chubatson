<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOZA Tracker - Тест BLE</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            text-align: center;
            padding-top: 50px;
        }
        .status {
            padding: 15px;
            margin: 20px auto;
            border-radius: 8px;
            width: 80%;
            max-width: 300px;
            font-weight: bold;
        }
        .disconnected { background: #b71c1c; }
        .connected { background: #1b5e20; }
        .btn-connect {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>KOZA Tracker - Тест Bluetooth <span style="font-size: 0.7em; opacity: 0.6;">v2.0</span></h1>
    
    <div id="status" class="status disconnected">
        Статус: Отключено
    </div>
    
    <button id="connectBtn" class="btn-connect" onclick="connectBLE()">
        🔗 Поиск и подключение
    </button>

    <p style="margin-top: 30px; font-size: 0.8em;">
        * Убедитесь, что вы используете **Chrome** на **Android** (или настольный Chrome по HTTPS) и ESP32 "База" включена.
    </p>

    <script>
        let bleDevice = null;
        const BLE_SERVICE_UUID = '00001101-0000-1000-8000-00805f9b34fb'; 
        const BLE_CHARACTERISTIC_UUID = '00001101-0000-1000-8000-00805f9b34fb'; 

        function setStatus(text, isConnected = false) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = `Статус: ${text}`;
            statusEl.className = isConnected ? 'status connected' : 'status disconnected';
            document.getElementById('connectBtn').textContent = isConnected ? '✔ Подключено' : '🔗 Поиск и подключение';
            document.getElementById('connectBtn').disabled = isConnected;
        }

        function onDisconnected(event) {
            console.log('BLE Device disconnected:', event.target.name);
            setStatus('Отключено');
            bleDevice = null;
        }

        async function connectBLE() {
            if (!navigator.bluetooth) {
                alert('Ошибка: Ваш браузер не поддерживает Web Bluetooth.');
                return;
            }
            
            try {
                setStatus('Поиск устройства...');

                // 1. Поиск устройства по имени KOZA_
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'KOZA_' }], 
                    optionalServices: [BLE_SERVICE_UUID] 
                });

                setStatus('Подключение...');
                
                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                // 2. Подключение
                const server = await bleDevice.gatt.connect();
                
                // 3. Получение сервиса (для проверки)
                const service = await server.getPrimaryService(BLE_SERVICE_UUID);
                
                // 4. Получение характеристики (для готовности к чтению/записи)
                await service.getCharacteristic(BLE_CHARACTERISTIC_UUID);
                
                setStatus('Подключено', true);
                alert(`Успешно подключено к ${bleDevice.name}!`);
                
            } catch (error) {
                console.error('BLE Connection Failed:', error);
                
                let msg = error.message.includes('User cancelled') ? 
                    'Пользователь отменил выбор устройства.' : 
                    `Ошибка: ${error.message}.`;

                setStatus('Ошибка подключения');
                alert(msg);
            }
        }
    </script>
</body>
</html>
